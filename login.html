<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chai Huah Auto Parts & Service</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="login-container d-flex justify-content-center align-items-center">
  <div class="login-card p-4 p-md-5">

    <div class="text-center mb-4">
      <div class="logo-box mb-3" aria-hidden="true">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <path d="M20.4 6.7 17.2 9.9l-3.1-3.1 3.2-3.2a5.4 5.4 0 0 0-6.6 6.7L4.4 16.6a2.1 2.1 0 0 0 3 3l6.3-6.3a5.4 5.4 0 0 0 6.7-6.6Z"></path>
          <path d="M5.8 18.2h.01"></path>
        </svg>
      </div>
      <h3 class="fw-bold">Chai Huah Auto Parts & Service</h3>
      <p class="text-muted small">Sign in to your account</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-icon-group">
          <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-10 6L2 7"></path>
          </svg>
          <input type="email" id="email" class="form-control custom-input icon-input" placeholder="Enter your email" autocomplete="email" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-icon-group">
          <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" class="form-control custom-input icon-input password-input" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye-icon eye-open" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
              <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a15.6 15.6 0 0 1-3 4.2"></path>
              <path d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 8 10 8a10.7 10.7 0 0 0 4.2-.9"></path>
            </svg>
          </button>
        </div>
      </div>

      <div id="loginError" class="text-danger small mb-3 d-none">
        Invalid email or password.
      </div>

      <div class="login-actions mb-3">
        <button type="button" id="forgotPasswordLink" class="forgot-password-link">
          Forgot Password?
        </button>
      </div>

      <button type="submit" class="btn btn-warning w-100 login-btn">
        Sign In
      </button>
    </form>

  </div>
</div>

<div id="resetModal" class="reset-modal d-none" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
  <div class="reset-modal-panel">
    <button type="button" id="closeResetModal" class="reset-close-btn" aria-label="Close reset password dialog">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </svg>
    </button>

    <div class="reset-step" data-reset-step="email">
      <h4 id="resetModalTitle" class="fw-bold mb-2">Reset Password</h4>
      <p class="text-muted small mb-4">We will send a 6-digit OTP to the registered staff email.</p>

      <form id="requestOtpForm">
        <div class="mb-3">
          <label class="form-label" for="resetEmail">Email</label>
          <input type="email" id="resetEmail" class="form-control custom-input fixed-email-input" value="chaihuahautoparts@gmail.com" readonly aria-readonly="true">
        </div>
        <div id="requestOtpMessage" class="reset-message small d-none"></div>
        <button type="submit" class="btn btn-warning w-100 login-btn">Send OTP</button>
      </form>
    </div>

    <div class="reset-step d-none" data-reset-step="otp">
      <h4 class="fw-bold mb-2">Enter OTP</h4>
      <p class="text-muted small mb-3">Check your email for the 6-digit code.</p>

      <div class="otp-timer mb-3">
        <span>OTP expires in</span>
        <strong id="otpTimer">60s</strong>
      </div>

      <form id="verifyOtpForm">
        <div class="mb-3">
          <label class="form-label" for="otpCode">OTP</label>
          <input type="text" id="otpCode" class="form-control custom-input otp-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
        </div>
        <div id="verifyOtpMessage" class="reset-message small d-none"></div>
        <button type="submit" class="btn btn-warning w-100 login-btn">Verify OTP</button>
      </form>

      <button type="button" id="requestAnotherOtp" class="forgot-password-link reset-secondary-action" disabled>
        Request another OTP
      </button>
    </div>

    <div class="reset-step d-none" data-reset-step="password">
      <h4 class="fw-bold mb-2">Create New Password</h4>
      <p class="text-muted small mb-4">Use at least 6 characters.</p>

      <form id="resetPasswordForm">
        <div class="mb-3">
          <label class="form-label" for="newPassword">New Password</label>
          <div class="input-icon-group">
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="newPassword" class="form-control custom-input icon-input password-input" placeholder="Enter new password" autocomplete="new-password" required minlength="6">
            <button type="button" id="toggleNewPassword" class="password-toggle" aria-label="Show new password" aria-pressed="false">
              <svg class="eye-icon eye-open" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a15.6 15.6 0 0 1-3 4.2"></path>
                <path d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 8 10 8a10.7 10.7 0 0 0 4.2-.9"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmNewPassword">Confirm Password</label>
          <div class="input-icon-group">
            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="confirmNewPassword" class="form-control custom-input icon-input password-input" placeholder="Confirm new password" autocomplete="new-password" required minlength="6">
            <button type="button" id="toggleConfirmNewPassword" class="password-toggle" aria-label="Show confirm password" aria-pressed="false">
              <svg class="eye-icon eye-open" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a15.6 15.6 0 0 1-3 4.2"></path>
                <path d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 8 10 8a10.7 10.7 0 0 0 4.2-.9"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="resetPasswordMessage" class="reset-message small d-none"></div>
        <button type="submit" class="btn btn-warning w-100 login-btn">Reset Password</button>
      </form>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
